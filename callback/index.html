<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Glanceboard</title>
<meta name="referrer" content="no-referrer">
<style>body{font:17px/1.5 -apple-system,system-ui,sans-serif;max-width:520px;margin:15vh auto;padding:0 16px;text-align:center}a{display:inline-block;margin-top:12px;padding:12px 22px;border-radius:12px;background:#3a7be0;color:#fff;text-decoration:none}</style></head>
<body><p>Volviendo a Glanceboard…</p><p><a id="go" href="glanceboard://tesla">Abrir Glanceboard</a></p>
<script>
// Hands Tesla's sign-in result (code and state) to the app. Nothing is stored or sent anywhere else.
var q = location.search;
var target = /Android/i.test(navigator.userAgent)
  ? "intent://tesla" + q + "#Intent;scheme=glanceboard;package=com.zerocoolspain.glanceboard;end"
  : "glanceboard://tesla" + q;
document.getElementById("go").href = target;
location.replace(target);
</script></body></html>
